<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --ink:#16241D;
    --muted:#6B7472;
    --accent:#069A57;
    --accent-deep:#0B5B38;
    --soft:#DBEFE3;
    --line:#E5E7E9;
    --warn:#D95B43;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Pretendard",-apple-system,"Malgun Gothic",sans-serif;
    line-height:1.55;
  }

  /* ===== 레이아웃: 사이드바 + 본문 ===== */
  .layout{
    display:grid;
    grid-template-columns:240px minmax(0,1fr);
    max-width:1180px;margin:0 auto;
    gap:26px;padding:26px 20px 64px;
  }
  aside{
    border-right:1px solid var(--line);
    padding-right:22px;
  }
  .side-inner{position:sticky;top:22px;display:flex;flex-direction:column;
    gap:14px;max-height:calc(100vh - 44px)}
  .eyebrow{
    font-size:11px;letter-spacing:.16em;color:var(--ink);
    text-transform:uppercase;font-weight:600;
  }
  .search{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;
    width:100%;outline:none;
  }
  .search::placeholder{color:var(--muted)}
  .search:focus{border-color:var(--accent)}
  nav#titleList{
    display:flex;flex-direction:column;gap:4px;
    overflow-y:auto;flex:1;min-height:0;
  }
  nav#titleList button{
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    border:none;background:transparent;color:var(--ink);
    font:inherit;font-size:14.5px;text-align:left;
    padding:9px 12px;border-radius:10px;cursor:pointer;
  }
  nav#titleList button:hover{background:#F2F5F2}
  nav#titleList button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  nav#titleList button.on{background:var(--accent-deep);color:#fff;font-weight:700}
  nav#titleList button .cnt{
    font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
  nav#titleList button.on .cnt{color:rgba(255,255,255,.75)}
  .no-result{font-size:13px;color:var(--muted);padding:8px 12px}
  #compareLink{
    border:none;background:transparent;color:var(--ink);
    font:inherit;font-size:14.5px;font-weight:600;text-align:left;
    padding:10px 12px;border-radius:10px;cursor:pointer;
    border-top:1px solid var(--line);border-radius:0;padding-top:16px;
  }
  #compareLink:hover{color:var(--accent-deep)}
  #compareLink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #compareLink.on{color:var(--accent-deep)}
  #compareLink .arrow{display:inline-block;margin-right:6px;font-size:12px}

  main{min-width:0}
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;flex-wrap:wrap;margin-bottom:16px;
  }
  h1{
    font-weight:700;letter-spacing:-.01em;
    font-size:clamp(22px,3.4vw,28px);line-height:1.3;
  }
  .updated{font-size:13px;color:var(--muted)}

  /* ===== 히어로 ===== */
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 26px 24px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
  }
  .hero-label{
    font-size:13.5px;color:var(--muted);margin-bottom:6px;
  }
  .hero-count{display:flex;align-items:center;gap:13px}
  .hero-count .num{
    font-size:clamp(40px,7vw,58px);font-weight:800;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;line-height:1;
  }
  .heart{
    width:clamp(28px,4vw,38px);height:auto;flex-shrink:0;
    animation:beat 2.4s ease-in-out infinite;transform-origin:center;
  }
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.07)}24%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.heart{animation:none}}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--soft);color:var(--accent-deep);
    border-radius:999px;padding:8px 15px;font-weight:700;font-size:14.5px;
    font-variant-numeric:tabular-nums;
  }
  .chip small{font-weight:500;color:var(--muted)}
  .chip.down{background:#F8E4DE;color:var(--warn)}

  /* ===== 스탯 카드 ===== */
  .stats{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
    gap:10px;margin-bottom:22px;
  }
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 17px;
  }
  .stat .k{font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .stat .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat .v span{font-size:13px;font-weight:500;color:var(--muted)}

  /* ===== 섹션 공통 ===== */
  section{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 20px 16px;margin-bottom:16px;
  }
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;flex-wrap:wrap;margin-bottom:14px;
  }
  h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .btn-group{display:flex;gap:4px;flex-wrap:wrap}
  .btn-group button{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;cursor:pointer;
  }
  .btn-group button:hover{border-color:var(--accent)}
  .btn-group button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-group button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
  .chart-box{position:relative;height:300px}
  .chart-box.short{height:220px}
  .chart-box.tall{height:340px}
  .mode-note{font-size:12.5px;color:var(--muted);margin-top:10px}

  /* 날짜 이동 */
  .day-nav{display:flex;gap:4px;align-items:center}
  .day-nav select{
    border:1px solid var(--line);background:transparent;color:var(--ink);
    font:inherit;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer;
  }
  .day-nav button{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;cursor:pointer;
  }
  .day-nav button:hover:not(:disabled),.day-nav select:hover{border-color:var(--accent)}
  .day-nav button:disabled{opacity:.35;cursor:default}
  .day-nav button:focus-visible,.day-nav select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  /* ===== 표 ===== */
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 6px;text-align:right;font-size:14px;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;font-size:12.5px}
  tr:last-child td{border-bottom:none}
  td.up{color:var(--accent-deep);font-weight:600}
  td.down{color:var(--warn);font-weight:600}
  .swatch{
    display:inline-block;width:10px;height:10px;border-radius:3px;
    margin-right:7px;vertical-align:baseline;
  }
  .tbl-scroll{overflow-x:auto}

  /* 페이지네이션 */
  .pager{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:14px;
  }
  .pager button{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;
  }
  .pager button:hover:not(:disabled){border-color:var(--accent)}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .pager .page-info{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ===== 상태 메시지 ===== */
  .notice{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 20px;text-align:center;color:var(--muted);font-size:13px;
  }
  .notice strong{display:block;color:var(--ink);font-weight:700;
    font-size:14.5px;margin-bottom:6px}

  footer{margin-top:24px;text-align:center;font-size:11.5px;color:var(--muted)}
  .hidden{display:none}

  /* ===== 모바일 ===== */
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;gap:16px;padding:18px 16px 56px}
    aside{border-right:none;border-bottom:1px solid var(--line);
      padding-right:0;padding-bottom:14px}
    .side-inner{position:static;max-height:none}
    nav#titleList{flex-direction:row;overflow-x:auto;overflow-y:hidden;
      padding-bottom:4px}
    nav#titleList button{flex-shrink:0;background:var(--card);
      border:1px solid var(--line);border-radius:999px;padding:7px 14px}
    nav#titleList button .cnt{display:none}
    #compareLink{border-top:none;padding:4px 12px 0}
  }
</style>
</head>
<body>
<div class="layout">

  <aside>
    <div class="side-inner">
      <div class="eyebrow">Favorite Tracker</div>
      <input type="search" id="search" class="search" placeholder="작품명 검색" autocomplete="off">
      <nav id="titleList" aria-label="작품 목록"></nav>
      <button type="button" id="compareLink" class="hidden">
        <span class="arrow">▶</span>작품별로 비교하기
      </button>
    </div>
  </aside>

  <main>
    <header>
      <h1 id="titleName"></h1>
      <div class="updated" id="updatedAt"></div>
    </header>

    <div id="empty" class="notice hidden">
      <strong>아직 수집된 데이터가 없어요</strong>
      GitHub Actions가 첫 실행을 마치면 여기에 추이가 나타납니다.<br>
      저장소의 Actions 탭에서 「관심수 수집」을 수동 실행해 보세요.
    </div>

    <!-- ===== 단일 작품 뷰 ===== -->
    <div id="dash" class="hidden">

      <div class="hero">
        <div>
          <div class="hero-label">현재 관심수</div>
          <div class="hero-count">
            <svg class="heart" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="var(--accent)" d="M12 21s-7.5-4.9-10-9.3C.3 8.6 2 5 5.5 5c2 0 3.4 1.1 4.3 2.5.4.6 1.9.6 2.3 0C13 6.1 14.5 5 16.5 5 20 5 21.7 8.6 22 11.7 19.5 16.1 12 21 12 21z"/>
            </svg>
            <div class="num" id="currentCount">–</div>
          </div>
        </div>
        <div class="chip" id="chip24"></div>
      </div>

      <div class="stats">
        <div class="stat"><div class="k">오늘 증가 (KST)</div><div class="v" id="todayDelta">–</div></div>
        <div class="stat"><div class="k">최근 24시간 증가</div><div class="v" id="delta24">–</div></div>
        <div class="stat"><div class="k">시간당 평균 (24h)</div><div class="v" id="hourlyAvg">–</div></div>
        <div class="stat"><div class="k">기록 수</div><div class="v" id="recordCount">–</div></div>
      </div>

      <section>
        <div class="sec-head">
          <h2>관심수 추이</h2>
          <div class="btn-group" id="rangeBtns" role="group" aria-label="조회 기간">
            <button data-h="24">24시간</button>
            <button data-h="72">3일</button>
            <button data-h="168">7일</button>
            <button data-h="0" class="on">전체</button>
          </div>
        </div>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
      </section>

      <section>
        <div class="sec-head">
          <h2>시간별 증가량</h2>
          <div class="day-nav">
            <button type="button" id="dayPrev" aria-label="이전 날짜">◀</button>
            <select id="daySelect" aria-label="날짜 선택"></select>
            <button type="button" id="dayNext" aria-label="다음 날짜">▶</button>
          </div>
        </div>
        <div class="chart-box short"><canvas id="deltaChart"></canvas></div>
        <div class="mode-note" id="deltaNote"></div>
      </section>

      <section>
        <div class="sec-head">
          <h2>일별 기록</h2>
          <div class="btn-group" id="pageSizeBtns" role="group" aria-label="페이지당 개수">
            <button data-n="5">5개씩</button>
            <button data-n="10" class="on">10개씩</button>
            <button data-n="30">30개씩</button>
            <button data-n="50">50개씩</button>
          </div>
        </div>
        <table>
          <thead><tr><th>날짜</th><th>마감 관심수</th><th>일일 증가</th></tr></thead>
          <tbody id="dailyBody"></tbody>
        </table>
        <div class="pager">
          <button type="button" id="pagePrev" aria-label="이전 페이지">◀ 이전</button>
          <span class="page-info" id="pageInfo"></span>
          <button type="button" id="pageNext" aria-label="다음 페이지">다음 ▶</button>
        </div>
      </section>

    </div>

    <!-- ===== 비교 뷰 ===== -->
    <div id="compare" class="hidden">

      <section>
        <div class="sec-head">
          <h2>작품 비교</h2>
          <div class="btn-group" id="cmpModeBtns" role="group" aria-label="비교 방식">
            <button data-mode="growth" class="on">증가량</button>
            <button data-mode="absolute">관심수</button>
          </div>
        </div>
        <div class="sec-head" style="margin-top:-4px">
          <div class="btn-group" id="cmpRangeBtns" role="group" aria-label="조회 기간">
            <button data-h="24">24시간</button>
            <button data-h="72" class="on">3일</button>
            <button data-h="168">7일</button>
            <button data-h="0">전체</button>
          </div>
        </div>
        <div class="chart-box tall"><canvas id="cmpChart"></canvas></div>
        <div class="mode-note" id="cmpNote"></div>
      </section>

      <section>
        <div class="sec-head"><h2>작품별 요약</h2></div>
        <div class="tbl-scroll">
          <table>
            <thead><tr>
              <th>작품</th><th>현재 관심수</th><th>오늘 증가</th>
              <th>24시간 증가</th><th>시간당 평균</th>
            </tr></thead>
            <tbody id="cmpBody"></tbody>
          </table>
        </div>
      </section>

    </div>

    <footer>매시간 자동 수집 · GitHub Actions + GitHub Pages</footer>
  </main>
</div>

<script>
(async function(){
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString("ko-KR");
  const KST = 9*3600*1000;
  const COMPARE = "__compare__";

  const kstDateKey = t => {
    const d = new Date(t + KST);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`;
  };
  const kstHourOf = t => new Date(t + KST).getUTCHours();
  const fmtTime = t => new Intl.DateTimeFormat("ko-KR",
    {timeZone:"Asia/Seoul", month:"numeric", day:"numeric", hour:"numeric", minute:"2-digit"}).format(new Date(t));
  const fmtHour = t => new Intl.DateTimeFormat("ko-KR",
    {timeZone:"Asia/Seoul", hour:"numeric"}).format(new Date(t));
  const signed = n => (n>0?"+":"") + fmt(n);
  const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const fmtDayLabel = key => {
    const [y,m,d] = key.split("-").map(Number);
    const wd = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",weekday:"short"})
      .format(new Date(Date.UTC(y, m-1, d, 12)));
    return `${m}.${d} (${wd})`;
  };

  Chart.defaults.font.family = '"Pretendard", sans-serif';
  Chart.defaults.color = css("--muted");

  const PALETTE = ["#069A57","#4C5FD5","#E2604A","#C98A1B","#8455C9","#1793A6","#C24C86","#5E7212"];

  // 시그니처: 자정(KST)마다 컷 경계선 (category 축용)
  const dayGutter = {
    id:"dayGutter",
    afterDraw(chart){
      const pts = chart.data.rawTimes;
      if(!pts || pts.length < 2) return;
      const {ctx, chartArea:a, scales:{x}} = chart;
      ctx.save();
      let prev = kstDateKey(pts[0]);
      for(let i=1;i<pts.length;i++){
        const key = kstDateKey(pts[i]);
        if(key !== prev){
          const px = (x.getPixelForValue(i-1) + x.getPixelForValue(i)) / 2;
          ctx.strokeStyle = css("--line");
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
          ctx.fillStyle = css("--muted");
          ctx.font = '11px "Pretendard", sans-serif';
          ctx.textAlign = "left";
          ctx.fillText(key.slice(5).replace("-","/"), px+5, a.top+12);
          prev = key;
        }
      }
      ctx.restore();
    }
  };

  // 자정 컷 경계선 (비교 차트: linear 시간축용)
  const dayGutterLinear = {
    id:"dayGutterLinear",
    afterDraw(chart){
      const {ctx, chartArea:a, scales:{x}} = chart;
      if(!x || x.min === undefined) return;
      ctx.save();
      let m = Math.ceil((x.min + KST) / 86400000) * 86400000 - KST;
      for(; m < x.max; m += 86400000){
        const px = x.getPixelForValue(m);
        if(px < a.left || px > a.right) continue;
        ctx.strokeStyle = css("--line");
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
        ctx.fillStyle = css("--muted");
        ctx.font = '11px "Pretendard", sans-serif';
        ctx.textAlign = "left";
        ctx.fillText(kstDateKey(m).slice(5).replace("-","/"), px+5, a.top+12);
      }
      ctx.restore();
    }
  };

  // ---------- 메타 + 전체 데이터 로드 ----------
  let meta = {};
  try{
    const r = await fetch("data/meta.json", {cache:"no-store"});
    if(r.ok) meta = await r.json();
  }catch(e){}

  let titles = meta.titles || {};
  let order = meta.titleOrder || Object.keys(titles);
  if(order.length === 0 && meta.titleId){
    titles = {[meta.titleId]: {titleName: meta.titleName}};
    order = [meta.titleId];
  }
  if(order.length === 0){
    $("empty").classList.remove("hidden");
    return;
  }

  async function loadCsv(tid){
    try{
      let r = await fetch(`data/${tid}.csv`, {cache:"no-store"});
      if(!r.ok && tid === order[0]) r = await fetch("data/history.csv", {cache:"no-store"});
      if(!r.ok) return [];
      const text = await r.text();
      return text.trim().split(/\r?\n/).slice(1)
        .map(line=>{
          const [t,c] = line.split(",");
          return {t:new Date(t).getTime(), c:parseInt(c,10)};
        })
        .filter(d=>Number.isFinite(d.t)&&Number.isFinite(d.c))
        .sort((a,b)=>a.t-b.t);
    }catch(e){ return []; }
  }

  const series = {};
  await Promise.all(order.map(async tid => { series[tid] = await loadCsv(tid); }));
  const withData = order.filter(tid => series[tid].length > 0);

  if(withData.length === 0){
    $("empty").classList.remove("hidden");
    return;
  }

  const nameOf = tid => (titles[tid] && titles[tid].titleName) || tid;
  const colorOf = tid => PALETTE[order.indexOf(tid) % PALETTE.length];

  function statsOf(rows){
    const latest = rows[rows.length-1];
    const at = cutoff => {
      let v = null;
      for(const r of rows){ if(r.t <= cutoff) v = r; else break; }
      return v;
    };
    const d = new Date(latest.t + KST);
    const dayStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - KST;
    const base24 = at(latest.t - 24*3600*1000) || rows[0];
    const baseDay = at(dayStart) || rows[0];
    const d24 = latest.c - base24.c;
    const spanH = Math.max((latest.t - base24.t)/3600000, 1);
    return {
      latest, d24,
      dToday: latest.c - baseDay.c,
      perHour: Math.round(d24/spanH),
    };
  }

  // ---------- 사이드바: 작품 목록 + 검색 + 비교 링크 ----------
  const listEl = $("titleList");
  for(const tid of order){
    const b = document.createElement("button");
    b.type = "button"; b.dataset.tid = tid;
    const nm = document.createElement("span");
    nm.textContent = nameOf(tid);
    const cnt = document.createElement("span");
    cnt.className = "cnt";
    const rows_ = series[tid];
    cnt.textContent = rows_.length ? fmt(rows_[rows_.length-1].c) : "–";
    b.append(nm, cnt);
    listEl.appendChild(b);
  }
  listEl.addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b || b.classList.contains("on")) return;
    location.hash = b.dataset.tid;
    select(b.dataset.tid);
  });

  $("search").addEventListener("input", e=>{
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    listEl.querySelectorAll("button").forEach(b=>{
      const hit = !q || b.firstChild.textContent.toLowerCase().includes(q);
      b.classList.toggle("hidden", !hit);
      if(hit) shown++;
    });
    let empty = listEl.querySelector(".no-result");
    if(shown === 0){
      if(!empty){
        empty = document.createElement("div");
        empty.className = "no-result";
        empty.textContent = "검색 결과가 없어요";
        listEl.appendChild(empty);
      }
    }else if(empty){
      empty.remove();
    }
  });

  if(order.length > 1){
    $("compareLink").classList.remove("hidden");
    $("compareLink").addEventListener("click", ()=>{
      location.hash = "compare";
      select(COMPARE);
    });
  }

  function setActive(tid){
    listEl.querySelectorAll("button").forEach(b=>
      b.classList.toggle("on", b.dataset.tid === tid));
    $("compareLink").classList.toggle("on", tid === COMPARE);
  }

  // ---------- 단일 작품 뷰 ----------
  let trendChart = null, deltaChart = null;
  let rows = [], latest = null, rangeH = 0;

  function drawTrend(){
    const cut = rangeH ? latest.t - rangeH*3600000 : 0;
    const data = rows.filter(r=>r.t >= cut);
    const many = data.length > 60;
    if(trendChart) trendChart.destroy();
    trendChart = new Chart($("trendChart"), {
      type:"line",
      data:{
        labels:data.map(r=>fmtTime(r.t)),
        rawTimes:data.map(r=>r.t),
        datasets:[{
          data:data.map(r=>r.c),
          borderColor:css("--accent"),
          backgroundColor:css("--soft"),
          borderWidth:2, fill:true, tension:.25,
          pointRadius:many?0:2.5, pointHoverRadius:4,
          pointBackgroundColor:css("--accent"),
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:"index", intersect:false},
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{label:c=>" 관심수 " + fmt(c.parsed.y)}}
        },
        scales:{
          x:{ticks:{maxTicksLimit:7, maxRotation:0}, grid:{display:false}},
          y:{grace:"5%", ticks:{callback:v=>fmt(v)}, grid:{color:css("--line")}}
        }
      },
      plugins:[dayGutter]
    });
  }

  // ---- 시간별 증가량: 날짜 선택 ----
  let dayOptions = [];
  let daySel = "recent";

  function allDeltas(){
    const out = [];
    for(let i=1;i<rows.length;i++){
      out.push({t:rows[i].t, d:rows[i].c - rows[i-1].c});
    }
    return out;
  }

  function buildDaySelect(){
    const dates = [...new Set(rows.map(r=>kstDateKey(r.t)))].sort().reverse();
    dayOptions = ["recent", ...dates];
    if(!dayOptions.includes(daySel)) daySel = "recent";
    const sel = $("daySelect");
    sel.innerHTML = "";
    for(const opt of dayOptions){
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = opt === "recent" ? "최근 48시간" : fmtDayLabel(opt);
      if(opt === daySel) o.selected = true;
      sel.appendChild(o);
    }
    syncDayNav();
  }

  function syncDayNav(){
    const i = dayOptions.indexOf(daySel);
    $("dayPrev").disabled = i >= dayOptions.length - 1;
    $("dayNext").disabled = i <= 0;
  }

  function drawDelta(){
    if(deltaChart) deltaChart.destroy();
    const note = $("deltaNote");

    if(daySel === "recent"){
      const recent = allDeltas().slice(-48);
      deltaChart = new Chart($("deltaChart"), {
        type:"bar",
        data:{
          labels:recent.map(r=>fmtHour(r.t)),
          rawTimes:recent.map(r=>r.t),
          datasets:[{
            data:recent.map(r=>r.d),
            backgroundColor:recent.map(r=>r.d < 0 ? css("--warn") : css("--accent")),
            borderRadius:3,
          }]
        },
        options:{
          responsive:true, maintainAspectRatio:false,
          plugins:{
            legend:{display:false},
            tooltip:{callbacks:{
              title:items=>fmtTime(recent[items[0].dataIndex].t),
              label:c=>" 증가 " + signed(c.parsed.y)
            }}
          },
          scales:{
            x:{ticks:{maxTicksLimit:12, maxRotation:0}, grid:{display:false}},
            y:{beginAtZero:true, ticks:{callback:v=>fmt(v)}, grid:{color:css("--line")}}
          }
        },
        plugins:[dayGutter]
      });
      note.textContent = "";
      return;
    }

    const slots = Array(24).fill(null);
    let total = 0, nRec = 0;
    for(const r of allDeltas()){
      if(kstDateKey(r.t) !== daySel) continue;
      const h = kstHourOf(r.t);
      slots[h] = (slots[h] ?? 0) + r.d;
      total += r.d; nRec++;
    }
    deltaChart = new Chart($("deltaChart"), {
      type:"bar",
      data:{
        labels:[...Array(24).keys()].map(h=>h+"시"),
        datasets:[{
          data:slots,
          backgroundColor:slots.map(v=>(v??0) < 0 ? css("--warn") : css("--accent")),
          borderRadius:3,
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{callbacks:{
            title:items=>`${fmtDayLabel(daySel)} ${items[0].label}`,
            label:c=>" 증가 " + signed(c.parsed.y)
          }}
        },
        scales:{
          x:{ticks:{maxTicksLimit:12, maxRotation:0}, grid:{display:false}},
          y:{beginAtZero:true, ticks:{callback:v=>fmt(v)}, grid:{color:css("--line")}}
        }
      }
    });
    note.textContent = nRec === 0
      ? `${fmtDayLabel(daySel)} — 이 날짜에는 증가량 기록이 없습니다.`
      : `${fmtDayLabel(daySel)} 총 증가 ${signed(total)} · 기록 ${nRec}회` +
        (nRec < 24 ? " · 빈 시간대는 수집이 없었던 구간입니다" : "");
  }

  // ---- 일별 기록: 페이지네이션 ----
  let pageSize = 10;
  let page = 1;
  let dailyRows = [];   // [{date, close, diff}] 최신순

  function buildDaily(){
    const byDay = new Map();
    for(const r of rows) byDay.set(kstDateKey(r.t), r.c);
    const days = [...byDay.entries()];
    dailyRows = [];
    for(let i=days.length-1; i>=0; i--){
      const [date, close] = days[i];
      const prevClose = i>0 ? days[i-1][1] : null;
      dailyRows.push({date, close, diff: prevClose === null ? null : close - prevClose});
    }
  }

  function drawTable(){
    const totalPages = Math.max(1, Math.ceil(dailyRows.length / pageSize));
    page = Math.min(Math.max(1, page), totalPages);
    const start = (page - 1) * pageSize;
    const slice = dailyRows.slice(start, start + pageSize);

    const tbody = $("dailyBody");
    tbody.innerHTML = "";
    for(const r of slice){
      const tr = document.createElement("tr");
      const cls = r.diff === null ? "" : (r.diff < 0 ? "down" : "up");
      tr.innerHTML = `<td>${r.date.replace(/-/g,".")}</td>` +
                     `<td>${fmt(r.close)}</td>` +
                     `<td class="${cls}">${r.diff===null?"–":signed(r.diff)}</td>`;
      tbody.appendChild(tr);
    }
    $("pageInfo").textContent = `${page} / ${totalPages}`;
    $("pagePrev").disabled = page <= 1;
    $("pageNext").disabled = page >= totalPages;
  }

  function showSingle(tid){
    $("compare").classList.add("hidden");
    rows = series[tid] || [];
    const name = nameOf(tid);
    $("titleName").textContent = name;
    document.title = name;

    if(rows.length === 0){
      $("dash").classList.add("hidden");
      $("empty").classList.remove("hidden");
      return;
    }
    $("empty").classList.add("hidden");
    $("dash").classList.remove("hidden");

    const s = statsOf(rows);
    latest = s.latest;
    $("currentCount").textContent = fmt(latest.c);
    $("updatedAt").textContent = "마지막 기록 " + fmtTime(latest.t);
    $("recordCount").innerHTML = fmt(rows.length) + " <span>회</span>";
    $("delta24").textContent = signed(s.d24);
    $("todayDelta").textContent = signed(s.dToday);
    $("hourlyAvg").innerHTML = fmt(s.perHour) + " <span>/시간</span>";
    const chip = $("chip24");
    chip.innerHTML = signed(s.d24) + " <small>지난 24시간</small>";
    chip.classList.toggle("down", s.d24 < 0);

    page = 1;
    buildDaily();
    drawTrend(); buildDaySelect(); drawDelta(); drawTable();
  }

  // ---------- 비교 뷰 ----------
  let cmpChart = null;
  let cmpMode = "growth";
  let cmpRangeH = 72;

  function drawCompare(){
    const now = Math.max(...withData.map(tid => series[tid][series[tid].length-1].t));
    const cut = cmpRangeH ? now - cmpRangeH*3600000 : 0;

    const datasets = [];
    for(const tid of withData){
      const data = series[tid].filter(r=>r.t >= cut);
      if(data.length === 0) continue;
      const base = cmpMode === "growth" ? data[0].c : 0;
      datasets.push({
        label: nameOf(tid),
        data: data.map(r=>({x:r.t, y:r.c - base})),
        borderColor: colorOf(tid),
        backgroundColor: colorOf(tid),
        borderWidth: 2, fill: false, tension: .25,
        pointRadius: data.length > 60 ? 0 : 2,
        pointHoverRadius: 4,
      });
    }

    if(cmpChart) cmpChart.destroy();
    cmpChart = new Chart($("cmpChart"), {
      type:"line",
      data:{datasets},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:"nearest", axis:"x", intersect:false},
        plugins:{
          legend:{position:"bottom", labels:{usePointStyle:true, pointStyle:"rectRounded", boxWidth:9, boxHeight:9, padding:16}},
          tooltip:{callbacks:{
            title:items=>fmtTime(items[0].parsed.x),
            label:c=>` ${c.dataset.label}: ${cmpMode==="growth" ? signed(c.parsed.y) : fmt(c.parsed.y)}`
          }}
        },
        scales:{
          x:{
            type:"linear",
            ticks:{maxTicksLimit:7, maxRotation:0, callback:v=>fmtTime(v)},
            grid:{display:false}
          },
          y:{
            grace:"5%",
            ticks:{callback:v=>cmpMode==="growth" ? signed(v) : fmt(v)},
            grid:{color:css("--line")}
          }
        }
      },
      plugins:[dayGutterLinear]
    });

    $("cmpNote").textContent = cmpMode === "growth"
      ? "증가량 모드: 각 작품의 기간 시작 시점을 0으로 맞춰, 선택한 기간 동안 얼마나 늘었는지를 비교합니다."
      : "관심수 모드: 실제 관심수 값을 그대로 겹쳐 보여줍니다. 작품 간 규모 차이가 크면 증가량 모드가 비교에 유리합니다.";
  }

  function drawCompareTable(){
    const tbody = $("cmpBody");
    tbody.innerHTML = "";
    const ranked = [...withData].sort((a,b)=>statsOf(series[b]).d24 - statsOf(series[a]).d24);
    for(const tid of ranked){
      const s = statsOf(series[tid]);
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td><span class="swatch" style="background:${colorOf(tid)}"></span>${nameOf(tid)}</td>` +
        `<td>${fmt(s.latest.c)}</td>` +
        `<td class="${s.dToday<0?"down":"up"}">${signed(s.dToday)}</td>` +
        `<td class="${s.d24<0?"down":"up"}">${signed(s.d24)}</td>` +
        `<td>${fmt(s.perHour)}/시간</td>`;
      tbody.appendChild(tr);
    }
  }

  function showCompare(){
    $("dash").classList.add("hidden");
    $("empty").classList.add("hidden");
    $("compare").classList.remove("hidden");
    $("titleName").textContent = "작품 비교";
    document.title = "작품 비교";
    const lastT = Math.max(...withData.map(tid => series[tid][series[tid].length-1].t));
    $("updatedAt").textContent = "마지막 기록 " + fmtTime(lastT);
    drawCompare(); drawCompareTable();
  }

  // ---------- 선택 ----------
  function select(tid){
    setActive(tid);
    if(tid === COMPARE) showCompare();
    else showSingle(tid);
  }

  // 단일 뷰 기간 토글
  $("rangeBtns").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b) return;
    document.querySelectorAll("#rangeBtns button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    rangeH = parseInt(b.dataset.h,10);
    if(latest) drawTrend();
  });

  // 시간별 증가량: 날짜 선택
  $("daySelect").addEventListener("change", e=>{
    daySel = e.target.value;
    syncDayNav();
    drawDelta();
  });
  $("dayPrev").addEventListener("click", ()=>{
    const i = dayOptions.indexOf(daySel);
    if(i < dayOptions.length - 1){
      daySel = dayOptions[i+1];
      $("daySelect").value = daySel;
      syncDayNav(); drawDelta();
    }
  });
  $("dayNext").addEventListener("click", ()=>{
    const i = dayOptions.indexOf(daySel);
    if(i > 0){
      daySel = dayOptions[i-1];
      $("daySelect").value = daySel;
      syncDayNav(); drawDelta();
    }
  });

  // 일별 기록: 페이지 크기 + 페이지 이동
  $("pageSizeBtns").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b) return;
    document.querySelectorAll("#pageSizeBtns button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    pageSize = parseInt(b.dataset.n,10);
    page = 1;
    drawTable();
  });
  $("pagePrev").addEventListener("click", ()=>{ page--; drawTable(); });
  $("pageNext").addEventListener("click", ()=>{ page++; drawTable(); });

  // 비교 모드/기간 토글
  $("cmpModeBtns").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b) return;
    document.querySelectorAll("#cmpModeBtns button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    cmpMode = b.dataset.mode;
    drawCompare();
  });
  $("cmpRangeBtns").addEventListener("click", e=>{
    const b = e.target.closest("button");
    if(!b) return;
    document.querySelectorAll("#cmpRangeBtns button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    cmpRangeH = parseInt(b.dataset.h,10);
    drawCompare();
  });

  // 시작: 해시 → #compare 또는 #titleId
  const h = location.hash.slice(1);
  if(h === "compare" && order.length > 1) select(COMPARE);
  else select(order.includes(h) ? h : order[0]);
})();
</script>
</body>
</html>
